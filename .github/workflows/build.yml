name: build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '*.*'
  pull_request:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'
          gpg-private-key: ${{ secrets.PGP_PRIVATE_KEY }}
      - uses: sbt/setup-sbt@v1.5.8
      - name: Test
        env:
          CI_VERSION: ${{ github.ref }}
        run: sbt "; testFull"
      - name: Publish
        env:
          CI_VERSION: ${{ github.ref }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        if: github.event_name == 'release'
        run: |
          sbt "; publishSigned; sonaRelease"
  dependency-graph:
    name: Update Dependency Graph
    runs-on: ubuntu-latest
    # Submitting a snapshot needs a token that may write to the repository. Runs that Dependabot
    # triggers are given a read-only one whatever the event, so there this job can only fail.
    if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: sbt/setup-sbt@v1.5.8
      - uses: scalacenter/sbt-dependency-submission@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
