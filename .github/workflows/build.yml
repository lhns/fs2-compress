name: build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '*.*'
  pull_request:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    # sbt 2 reads the environment once, when the server starts, and every later step attaches to
    # that same server. Anything sbt needs therefore has to be here rather than on the step that
    # happens to use it, or the step that starts the server decides what the rest of them see.
    env:
      CI_VERSION: ${{ github.ref }}
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'
          gpg-private-key: ${{ secrets.PGP_PRIVATE_KEY }}
      - uses: sbt/setup-sbt@v1.5.8
      - name: Test
        run: sbt "; testFull"
      # Everything a release does apart from the upload, so that a broken publishing setup is
      # found on the branch that breaks it rather than at the next release. publishTo is forced
      # here rather than left to the version: a build with no tag is a snapshot, and a snapshot
      # publishes straight to Sonatype rather than to the staging directory. Nothing may leave
      # the runner, so the resolver is pinned instead of being derived.
      - name: Check the release path
        if: github.event_name == 'push'
        run: sbt "; set every publishTo := localStaging.value ; publishSigned; sonaBundle"
      - name: Publish
        if: github.event_name == 'release'
        run: |
          sbt "; publishSigned; sonaRelease"
  dependency-graph:
    name: Update Dependency Graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sbt/setup-sbt@v1.5.8
      - uses: scalacenter/sbt-dependency-submission@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: env.GITHUB_TOKEN && github.event_name != 'pull_request'
